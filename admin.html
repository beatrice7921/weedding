<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚禮管理後台</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <!-- 登入頁面 -->
    <div class="admin-login" id="login-page">
        <div class="login-card">
            <h1>🔐 管理後台</h1>
            <p>請輸入密碼以進入管理介面</p>
            <form id="login-form">
                <input type="password" id="password" placeholder="請輸入密碼" required>
                <button type="submit" class="btn btn-primary btn-block">登入</button>
            </form>
            <p class="login-error" id="login-error"></p>
        </div>
    </div>

    <!-- 管理介面 -->
    <div class="admin-dashboard" id="dashboard" style="display: none;">
        <header class="admin-header">
            <h1>💒 婚禮管理後台</h1>
            <button class="btn btn-outline" onclick="logout()">登出</button>
        </header>

        <!-- 統計卡片 -->
        <section class="stats-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📋</div>
                    <div class="stat-number" id="total-rsvp">0</div>
                    <div class="stat-label">總回覆數</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-number" id="attending">0</div>
                    <div class="stat-label">確認出席</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-number" id="total-guests">0</div>
                    <div class="stat-label">總賓客數</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🥬</div>
                    <div class="stat-number" id="vegetarian">0</div>
                    <div class="stat-label">素食人數</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">❌</div>
                    <div class="stat-number" id="not-attending">0</div>
                    <div class="stat-label">無法出席</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💬</div>
                    <div class="stat-number" id="total-wishes">0</div>
                    <div class="stat-label">祝福留言</div>
                </div>
            </div>
        </section>

        <!-- 匯出按鈕 -->
        <section class="export-section">
            <h2>📤 匯出資料</h2>
            <div class="export-buttons">
                <button class="btn btn-primary" onclick="exportCSV()">匯出 CSV</button>
                <button class="btn btn-secondary" onclick="exportExcel()">匯出 Excel</button>
            </div>
        </section>

        <!-- RSVP 列表 -->
        <section class="data-section">
            <h2>📝 RSVP 回覆列表</h2>
            <div class="table-container">
                <table class="data-table" id="rsvp-table">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>電話</th>
                            <th>Email</th>
                            <th>出席</th>
                            <th>人數</th>
                            <th>素食</th>
                            <th>留言</th>
                            <th>時間</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="rsvp-tbody">
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 祝福留言列表 -->
        <section class="data-section">
            <h2>💝 祝福留言列表</h2>
            <div class="table-container">
                <table class="data-table" id="wishes-table">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>留言內容</th>
                            <th>時間</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="wishes-tbody">
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 危險區域 -->
        <section class="danger-section">
            <h2>⚠️ 危險區域</h2>
            <button class="btn btn-danger" onclick="clearAllData()">清除所有資料</button>
        </section>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
